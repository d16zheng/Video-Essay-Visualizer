name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: visualize_transcript_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d visualize_transcript_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/visualize_transcript_test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/visualize_transcript_test
      DATABASE_SSL: disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify production dependencies and release startup
        run: |
          npm prune --omit=dev
          npm run db:migrate
          npm run smoke:release
