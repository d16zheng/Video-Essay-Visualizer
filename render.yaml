services:
  - type: web
    name: visualize-transcript
    runtime: node
    plan: free
    region: ohio
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm run start:release
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: visualize-transcript-db
          property: connectionString
      - key: DATABASE_SSL
        value: disable
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: BASIC_AUTH_USERNAME
        sync: false
      - key: BASIC_AUTH_PASSWORD
        sync: false

databases:
  - name: visualize-transcript-db
    plan: free
    region: ohio
    postgresMajorVersion: "17"
